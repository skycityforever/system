<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极境守护 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/login_register_particle.css">
    <link rel="stylesheet" href="../static/login.css">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="login-card glass-panel">
        <h3 class="text-center neon-title mb-4">极境守护登录系统</h3>

        <!-- 仅保留登录表单（移除Flask语法） -->
        <div id="loginForm" class="form-box active">
            <!-- 移除Flask的error渲染语法 -->
            <form id="loginFormElement">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" name="username" id="username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" name="password" id="password" required>
                    <!-- 密码框下方添加错误提示 -->
                    <div class="login-error" id="loginError">账号或密码错误</div>
                </div>

                <button type="submit" class="btn btn-primary w-100">登录系统</button>
            </form>

            <!-- 注册链接指向register.html（移除toggleForm） -->
            <div class="text-center mt-4">
                <a href="/register">还没有账号？立即注册</a>
            </div>
        </div>
    </div>

    <!-- 登录验证逻辑 -->
    <script src="../static/login.js"></script>
    <script src="../static/login_register_particle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</body>
</html>
